<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운영 콘솔 · Faccon</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body>
<div class="demo-banner" role="note">가상 데이터로 만든 화면 데모입니다 · 회사명·금액·지표는 실제 거래가 아닙니다 · 브라우저 저장 · 실제 전송·결제 없음</div>
<div class="shell">
  <aside class="side" aria-label="주 메뉴">
    <a class="brand" href="./" style="color:inherit;text-decoration:none" title="서비스 소개로 돌아가기">
      <div><b>Faccon</b><small>연동약정 · 반영 · 증빙</small></div>
    </a>
    <nav id="nav"></nav><a class="btn" href="./my.html">내 업무 요약</a><button class="btn" data-reset style="margin-top:8px">가상 시나리오 초기화</button>
    <div class="side-foot" id="company-panel">
      <small>구매기업</small>
      <b>A정밀 (가상)</b>
      <small>대구 · 알루미늄 가공품</small>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="crumbs" id="crumbs"></div>
      <div class="role" role="group" aria-label="보는 사람 전환">
        <span>보는 사람</span>
        <button type="button" data-role="buyer" class="on">구매기업 담당자</button>
        <button type="button" data-role="supplier">공급기업 담당자</button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
