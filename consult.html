<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파일럿 상담 신청 · Faccon</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body class="consult-body">
<header class="nav">
  <a class="logo" href="./">Faccon</a>
  <div class="nav-cta"><a class="btn ghost" href="./login.html">기업 로그인</a></div>
</header>
<main class="consult">
  <section class="consult-card" aria-labelledby="consult-h" id="consult-card">
    <h1 id="consult-h">파일럿 상담 신청</h1>
    <p class="consult-lead">남겨 주시면 담당자가 연락드려 우리 회사 약정서로 어떻게 쓰는지 같이 확인합니다.</p>
    <form id="consult-form" novalidate>
      <label class="fld">회사명<input name="company" autocomplete="organization" required></label>
      <label class="fld">담당자 이름<input name="name" autocomplete="name" required></label>
      <label class="fld">연락처 <small>휴대폰 번호 또는 이메일</small><input name="contact" autocomplete="tel" required></label>
      <label class="fld">주로 다루는 품목 <small>선택</small><input name="item" placeholder="예: 알루미늄 가공 부품"></label>
      <label class="agree"><input type="checkbox" name="agree"> 상담 연락을 위해 위 정보를 받는 데 동의합니다.</label>
      <p class="err-msg" id="consult-err" role="alert"></p>
      <button class="btn solid lg wide" type="submit">상담 신청하기</button>
    </form>
    <p class="demo-note">데모 화면입니다. 입력하신 내용은 어디로도 전송되지 않습니다.</p>
  </section>
</main>
<script type="module" src="/src/consult/consult.ts"></script>
</body>
</html>
