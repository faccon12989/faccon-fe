<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시작하기 · 단가조정 운영</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body class="start-body">
<header class="nav">
  <a class="logo" href="./"><span class="mark" aria-hidden="true">₩↻</span>단가조정 운영</a>
  <div class="nav-cta"><a class="btn ghost" href="./">← 소개로</a></div>
</header>
<main class="start">
  <aside class="rail" aria-label="진행 단계">
    <p class="eyebrow">거래 등록 체험</p>
    <ol id="rail"></ol>
    <p class="rail-note">합성자료로 진행하는 데모입니다. 실제 문서·연락처를 입력하지 마세요. 설정 완료 상태만 이 브라우저에 저장합니다.</p>
  </aside>
  <section class="pane">
    <form id="step-form" novalidate>
      <div id="step"></div>
      <p class="err-msg" id="err" role="alert"></p>
      <div class="actions">
        <button type="button" class="btn ghost" id="back">이전</button>
        <button type="submit" class="btn solid" id="next">다음</button>
      </div>
    </form>
  </section>
</main>
<script type="module" src="/src/start/start.ts"></script>
</body>
</html>
