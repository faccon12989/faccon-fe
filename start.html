<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도입 설정 · Faccon</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
</head>
<body class="start-body">
<header class="nav">
  <a class="logo" href="./">Faccon</a>
  <div class="nav-cta"><a class="btn ghost" href="./my.html">← 대시보드로</a></div>
</header>
<main class="start">
  <aside class="rail" aria-label="진행 단계">
    <p class="eyebrow">도입 설정</p>
    <ol id="rail"></ol>
    <p class="rail-note">입력한 내용은 이 브라우저 안에서만 쓰이는 데모입니다. 어디로도 전송되지 않습니다.</p>
  </aside>
  <section class="pane">
    <form id="step-form" novalidate>
      <div id="step"></div>
      <p class="err-msg" id="err" role="alert"></p>
      <div class="actions">
        <button type="button" class="btn ghost" id="back">이전</button>
        <button type="submit" class="btn solid" id="next">다음</button>
      </div>
    </form>
  </section>
</main>
<script type="module" src="/src/start/start.ts"></script>
</body>
</html>
