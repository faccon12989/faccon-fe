<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기업 로그인 · Faccon</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
</head>
<body class="login-body">
<header class="nav">
  <a class="logo" href="./">Faccon</a>
  <div class="nav-cta"><a class="btn ghost" href="./consult.html">파일럿 상담 신청</a></div>
</header>
<main class="login">
  <section class="login-card" aria-labelledby="login-h">
    <h1 id="login-h">기업 로그인</h1>
    <form id="login-form" novalidate>
      <label class="fld">업무 이메일<input name="email" type="email" autocomplete="username" value="kim.buyer@a-precision.example"></label>
      <label class="fld">비밀번호<input name="password" type="password" autocomplete="current-password" value="demo-password"></label>
      <p class="err-msg" id="login-err" role="alert"></p>
      <button class="btn solid lg wide" type="submit">대시보드 열기</button>
    </form>
    <p class="no-account">계정이 없으십니까? <a href="./consult.html">파일럿 상담 신청</a></p>
    <p class="no-account">공급기업은 구매기업이 보낸 초대 메일의 링크로 들어옵니다.</p>
    <p class="demo-note">데모 계정이 미리 채워져 있습니다. 입력값은 어디로도 전송되지 않습니다.</p>
  </section>
</main>
<script type="module" src="/src/login/login.ts"></script>
</body>
</html>
